<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博整蛊点击器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1a1a3a 0%, #050510 45%, #000000 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 背景网格 */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 6s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        /* 扫描线 */
        .scanline {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                transparent 0%,
                rgba(139, 92, 246, 0.04) 50%,
                transparent 100%
            );
            animation: scanline 4s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* 闪光遮罩 */
        .flash-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            opacity: 0;
            z-index: 998;
            pointer-events: none;
            transition: opacity 0.12s ease;
        }

        .flash-overlay.active {
            opacity: 1;
        }

        /* 头像 */
        #avatar {
            width: 360px;
            height: 360px;
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid #6366f1;
            box-shadow:
                0 0 30px rgba(99, 102, 241, 0.5),
                0 0 60px rgba(139, 92, 246, 0.25),
                inset 0 0 30px rgba(99, 102, 241, 0.3);
            transition: all 0.12s ease;
            position: relative;
            z-index: 2;
            object-fit: cover;
        }

        #avatar:active {
            transform: scale(0.92);
            box-shadow:
                0 0 45px #818cf8,
                0 0 90px rgba(168, 162, 250, 0.4);
        }

        .tip-text {
            margin-top: 36px;
            font-size: 26px;
            color: #a5b4fc;
            text-shadow: 0 0 20px rgba(165, 180, 252, 0.5);
            position: relative;
            z-index: 2;
        }

        .count-display {
            margin-top: 12px;
            font-size: 18px;
            color: #cbd5e1;
            position: relative;
            z-index: 2;
        }

        /* 全屏爆炸图片【修复】默认隐藏 */
        .fullscreen-img-wrap {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            pointer-events: none;
            opacity: 0;
            visibility:hidden;
        }
        .fullscreen-img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scale(1);
        }
        .fullscreen-img-wrap.play-anim {
            opacity: 1;
            visibility:visible;
        }
        .fullscreen-img-wrap.play-anim .fullscreen-img {
            animation: zoomThenFade 1s ease forwards;
        }
        @keyframes zoomThenFade {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            60% {
                transform: scale(2);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* 头像震动 */
        .shake {
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(-8px,0); }
            40% { transform: translate(8px,0); }
            60% { transform: translate(-6px,0); }
            80% { transform: translate(6px,0); }
        }

        /* 粒子 */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: particleAnim 0.8s ease-out forwards;
            z-index: 997;
        }

        @keyframes particleAnim {
            0% {
                transform: translate(0,0) scale(1);
                opacity:1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity:0;
            }
        }

        /* ========== 牛皮癣广告样式 ========== */
        .war-ad {
            position: fixed;
            width: 130px;
            background: #111;
            border: 3px solid #ff2a2a;
            padding: 10px;
            z-index: 996;
            text-align: center;
            box-shadow:
                0 0 15px #ff2a2a,
                0 0 30px rgba(255,42,42,0.5);
            animation: adShake 0.8s infinite steps(1);
        }

        .war-ad-image {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
            animation: adPop 0.4s infinite steps(1);
        }

        @keyframes adPop {
            0%   { transform: scale(1); }
            49%  { transform: scale(1); }
            50%  { transform: scale(1.22); }
            100% { transform: scale(1.22); }
        }

        @keyframes adShake {
            0%   { transform: translateX(0); }
            49%  { transform: translateX(0); }
            50%  { transform: translateX(-5px); }
            100% { transform: translateX(-5px); }
        }

        .war-ad-text {
            margin-top: 8px;
            font-size: 13px;
            color: #ffcc00;
            font-weight: bold;
            text-shadow: 0 0 8px #ff2a2a;
        }

        .war-ad-link {
            margin-top: 6px;
            font-size: 11px;
            color: #00ff88;
            word-break: break-all;
        }

        .war-ad-link a {
            color: #00ff88;
            text-decoration: underline;
        }

        /* 更明显的关闭按钮 */
        .close-ad {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background: #ffffff;
            color: #ff0000;
            font-size: 20px;
            font-weight: 900;
            line-height: 24px;
            text-align: center;
            border-radius: 4px;
            box-shadow: 0 0 10px #ff0000;
            cursor: pointer;
            z-index: 10;
        }

        .close-ad:hover {
            background: #ffeeee;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="scanline"></div>
    <div class="flash-overlay" id="flash"></div>

    <!-- 全屏动画容器 -->
    <div class="fullscreen-img-wrap" id="fullWrap">
        <img class="fullscreen-img" id="fullImg" alt="全屏特效">
    </div>

    <!-- 初始右上角广告 -->
    <div class="war-ad" id="warAd" style="top:18px;right:18px;">
        <span class="close-ad">×</span>
        <img class="war-ad-image" src="warthunder_ad.jpg" alt="广告">
        <div class="war-ad-text">好想玩战雷</div>
        <div class="war-ad-link"><a href="https://www.warthunder.com" target="_blank">www.warthunder.com</a></div>
    </div>

    <img id="avatar" src="photo.jpg" alt="头像">
    <div class="tip-text">点击图片触发惊喜</div>
    <div class="count-display">点击次数：<span id="num">0</span></div>

    <audio id="audio" src="sound.mp3">

    <script>
        const avatar = document.getElementById('avatar');
        const audio = document.getElementById('audio');
        const numShow = document.getElementById('num');
        const flash = document.getElementById('flash');
        const fullWrap = document.getElementById('fullWrap');
        const fullImg = document.getElementById('fullImg');

        let clickCount = 0;

        // 触发配置：三位文件名 001.jpg / 001.mp3
        const surprises = [
            {
                count: 10,
                image: "001.jpg",
                sound: "001.mp3"
            },
            {
                count: 100,
                image: "002.jpg",
                sound: "002.mp3"
            },
            {
                count: 200,
                image: "003.jpg",
                sound: "003.mp3"
            }
        ];

        avatar.addEventListener('click', () => {
            clickCount++;
            numShow.innerText = clickCount;
            audio.currentTime = 0;
            audio.play().catch(() => {});

            avatar.classList.add('shake');
            setTimeout(() => avatar.classList.remove('shake'), 350);

            for (const item of surprises) {
                if (clickCount === item.count) {
                    triggerSurprise(item.image, item.sound);
                    break;
                }
            }
        });

        function triggerSurprise(imgSrc, soundSrc) {
            // 原有闪光+粒子保留
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 120);
            createParticles();

            // 加载全屏图片，播放动画+音效
            fullImg.src = imgSrc;
            const boomAudio = new Audio(soundSrc);
            boomAudio.play().catch(e=>{});

            // 播放动画
            fullWrap.classList.remove('play-anim');
            void fullWrap.offsetWidth;
            fullWrap.classList.add('play-anim');

            // ✅ 动画结束后隐藏全屏容器，恢复页面！（关键修复）
            setTimeout(()=>{
                fullWrap.classList.remove('play-anim');
            },1000);
        }

        function createParticles() {
            const colors = ['#8b5cf6', '#6366f1', '#ec4899', '#06b6d4'];
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = "50%";
                p.style.top = "50%";
                const angle = Math.random() * Math.PI * 2;
                const dist = 80 + Math.random() * 160;
                p.style.setProperty('--tx', Math.cos(angle) * dist + "px");
                p.style.setProperty('--ty', Math.sin(angle) * dist + "px");
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        // 广告繁殖逻辑：一个一个出现
        function createAd(x, y) {
            const ad = document.createElement('div');
            ad.className = "war-ad";
            ad.style.left = x + "px";
            ad.style.top = y + "px";
            ad.innerHTML = `
                <span class="close-ad">×</span>
                <img class="war-ad-image" src="warthunder_ad.jpg" alt="广告">
                <div class="war-ad-text">好想玩战雷</div>
                <div class="war-ad-link"><a href="https://www.warthunder.com" target="_blank">www.warthunder.com</a></div>
            `;
            document.body.appendChild(ad);
            bindAdClose(ad);
        }

        function bindAdClose(adEl) {
            const closeBtn = adEl.querySelector('.close-ad');
            closeBtn.onclick = function () {
                adEl.style.display = 'none';

                // 一个一个生成广告，间隔 300ms
                const count = 8;
                let i = 0;

                function nextAd() {
                    if (i >= count) return;

                    const rx = Math.random() * (window.innerWidth - 150);
                    const ry = Math.random() * (window.innerHeight - 150);
                    createAd(rx, ry);

                    i++;
                    setTimeout(nextAd, 300);
                }

                setTimeout(nextAd, 300);
            };
        }

        // 绑定初始广告关闭事件
        const initAd = document.querySelector("#warAd");
        bindAdClose(initAd);
    </script>
</body>
</html>
