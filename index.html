<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>点击有惊喜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #avatar {
            width: 360px;
            height: 360px;
            border-radius: 50%;
            cursor: pointer;
            border: 5px solid #ffffff;
            transition: transform 0.15s ease;
        }
        #avatar:active {
            transform: scale(0.94);
        }
        .tip-text {
            color: #ffffff;
            font-size: 24px;
            margin-top: 30px;
        }
        .special-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 40px 60px;
            font-size: 48px;
            font-weight: bold;
            border-radius: 16px;
            display: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <img id="avatar" src="photo.jpg" alt="大头照">
    <div class="tip-text">点击有惊喜</div>

    <div class="special-popup" id="popup"></div>

    <audio id="audio" src="sound.mp3" preload="auto">

    <script>
        const avatar = document.getElementById('avatar');
        const audio = document.getElementById('audio');
        const popup = document.getElementById('popup');
        let clickCount = 0;

        avatar.addEventListener('click', () => {
            clickCount++;
            audio.currentTime = 0;
            audio.play().catch(() => {});

            if (clickCount === 10) {
                showPopup("🎉第10次！");
            } else if (clickCount === 100) {
                showPopup("🔥第100次！！");
            } else if (clickCount === 200) {
                showPopup("💥第200次！！！");
            }
        });

        function showPopup(text) {
            popup.innerText = text;
            popup.style.display = 'block';
            setTimeout(() => {
                popup.style.display = 'none';
            }, 2000);
        }
    </script>
</body>
</html>
